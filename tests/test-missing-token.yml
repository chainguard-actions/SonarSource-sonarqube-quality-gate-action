name: Test missing SONAR_TOKEN
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy report file
        run: |
          mkdir -p .scannerwork
          cat > .scannerwork/report-task.txt <<'EOF'
          serverUrl=https://sonarqube.example.com
          ceTaskUrl=https://sonarqube.example.com/api/ce/task?id=abc123
          dashboardUrl=https://sonarqube.example.com/dashboard?id=myproject
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          SONAR_TOKEN: ""

      - name: Assert action failed due to missing SONAR_TOKEN
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when SONAR_TOKEN is not set, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when SONAR_TOKEN is missing"
