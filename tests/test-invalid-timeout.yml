name: Test invalid polling timeout
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy report file
        run: |
          mkdir -p .scannerwork
          cat > .scannerwork/report-task.txt <<'EOF'
          serverUrl=https://sonarqube.example.com
          ceTaskUrl=https://sonarqube.example.com/api/ce/task?id=abc123
          dashboardUrl=https://sonarqube.example.com/dashboard?id=myproject
          EOF

      - id: action-invalid-str
        uses: .
        continue-on-error: true
        env:
          SONAR_TOKEN: "fake-sonar-token-for-timeout-check"
        with:
          pollingTimeoutSec: "not-a-number"

      - name: Assert action failed due to invalid timeout (non-numeric)
        env:
          OUTCOME: ${{ steps.action-invalid-str.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with non-numeric timeout, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with non-numeric timeout"

      - id: action-zero-timeout
        uses: .
        continue-on-error: true
        env:
          SONAR_TOKEN: "fake-sonar-token-for-timeout-check"
        with:
          pollingTimeoutSec: "0"

      - name: Assert action failed due to invalid timeout (zero)
        env:
          OUTCOME: ${{ steps.action-zero-timeout.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with zero timeout, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with zero timeout"
