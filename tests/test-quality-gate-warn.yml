name: Test quality gate WARN
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake curl and metadata file
        run: |
          # Create metadata file
          mkdir -p .scannerwork
          cat > .scannerwork/report-task.txt <<'EOF'
          serverUrl=http://localhost:9000
          ceTaskUrl=http://localhost:9000/api/ce/task?id=AXlCe3gsFwOUsY8YKHTn
          EOF

          # Create fake curl that returns WARN quality gate status
          mkdir -p /tmp/fake-bin
          cat > /tmp/fake-bin/curl <<'CURLEOF'
          #!/bin/bash
          # Fake curl: honor -o flag for hardened action compatibility
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            prev="$arg"
          done

          url="${@: -1}"
          if echo "$url" | grep -q "qualitygates/project_status"; then
            payload='{"projectStatus":{"status":"WARN"}}'
          else
            payload='{"task":{"analysisId":"AXlCe3jz9LkwR9Gs0pBY","status":"SUCCESS"}}'
          fi

          if [ -n "$out" ]; then
            echo "$payload" > "$out"
          else
            echo "$payload"
          fi
          exit 0
          CURLEOF
          chmod +x /tmp/fake-bin/curl

      - id: action
        uses: .
        continue-on-error: true
        env:
          SONAR_TOKEN: fake-sonar-token-for-test
          PATH: /tmp/fake-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt

      - name: Assert action failed and quality-gate-status is WARN
        env:
          OUTCOME: ${{ steps.action.outcome }}
          STATUS: ${{ steps.action.outputs.quality-gate-status }}
        run: |
          echo "outcome: $OUTCOME"
          echo "quality-gate-status: $STATUS"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when quality gate status is WARN, got outcome '$OUTCOME'"
            exit 1
          fi
          if [ "$STATUS" != "WARN" ]; then
            echo "FAIL: expected quality-gate-status to be 'WARN', got '$STATUS'"
            exit 1
          fi
          echo "PASS: action correctly failed with quality-gate-status=WARN"
