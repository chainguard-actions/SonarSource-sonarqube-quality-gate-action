name: Test missing SONAR_TOKEN
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy metadata file so the token check is the first failure
        run: |
          mkdir -p .scannerwork
          echo "serverUrl=http://localhost:9000" > .scannerwork/report-task.txt
          echo "ceTaskUrl=http://localhost:9000/api/ce/task?id=AXlCe3gsFwOUsY8YKHTn" >> .scannerwork/report-task.txt

      - id: action
        uses: .
        continue-on-error: true
        # SONAR_TOKEN is intentionally NOT set

      - name: Assert action failed due to missing SONAR_TOKEN
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when SONAR_TOKEN is not set, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when SONAR_TOKEN was not provided"
