name: Test invalid report file content
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a report file with missing required fields
        run: |
          mkdir -p .scannerwork
          # Write a report file that is missing serverUrl and ceTaskUrl
          cat > .scannerwork/report-task.txt <<'EOF'
          dashboardUrl=https://sonarqube.example.com/dashboard?id=myproject
          projectKey=my-project
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          SONAR_TOKEN: "fake-sonar-token-for-content-check"

      - name: Assert action failed due to invalid report file content
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid report file content, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid report file content (missing serverUrl/ceTaskUrl)"
