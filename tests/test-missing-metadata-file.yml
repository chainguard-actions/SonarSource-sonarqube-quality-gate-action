name: Test missing metadata file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Ensure metadata file does not exist
        run: |
          rm -f .scannerwork/report-task.txt
          rm -rf .scannerwork

      - id: action
        uses: .
        continue-on-error: true
        env:
          SONAR_TOKEN: fake-sonar-token-for-test
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt

      - name: Assert action failed due to missing metadata file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when metadata file is missing, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when metadata file was not found"
