name: Test missing report file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          SONAR_TOKEN: "fake-sonar-token-for-file-check"
        with:
          scanMetadataReportFile: .scannerwork/nonexistent-report.txt

      - name: Assert action failed due to missing report file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when report file does not exist, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when report file is missing"
